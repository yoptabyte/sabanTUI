[package]
name = "sabantui"
version = "0.1.0"
edition = "2021"
description = "sabantui: Universal TUI for managing display configurations across X11, Wayland, GNOME, and KDE environments."
license = "MIT"
keywords = ["display", "tui", "wayland", "x11", "gnome", "kde"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = { version = "0.26", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# [dependencies.xrandr]
# git = "https://github.com/dzfranklin/xrandr-rs.git"
# optional = true

[dependencies.zbus]
version = "3"
default-features = false
features = ["tokio"]

[features]
default = ["backend-wlroots", "backend-gnome"]
backend-x11 = []
backend-wlroots = []
backend-gnome = []
backend-kde = []

[package.metadata.docs.rs]
all-features = true
